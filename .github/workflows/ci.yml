name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ci-placeholder-not-used
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and type checks
        run: |
          pnpm test
          pnpm check

      - name: Run lint and production build
        run: |
          pnpm lint
          pnpm build

      - name: Install headless Chromium
        run: pnpm exec playwright-core install --with-deps chromium-headless-shell

      - name: Run browser persistence checks
        run: pnpm test:persistence
